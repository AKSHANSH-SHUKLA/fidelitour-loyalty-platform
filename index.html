<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FidéliTour</title>

    <!-- PWA: makes the wallet card installable to the home screen on iOS and
         Android. This is the only way to get push notifications working on
         iOS (Apple requires standalone PWA install before web push fires).
         Once installed, the card opens fullscreen and silently re-subscribes
         on launch so we keep working endpoints even if the browser rotated. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#B85C38" />
    <meta name="application-name" content="FidéliTour" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FidéliTour" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Single professional font — Inter — used everywhere across the
         platform (landing page, dashboard, all forms). Replaces the previous
         mix of Cormorant Garamond + Manrope; the global body rule in
         index.css overrides any leftover references. Loaded with
         display=swap so first paint isn't blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Leaflet — real interactive map tiles for the Customer Map page.
         Loaded via CDN so we don't need an npm dependency. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
