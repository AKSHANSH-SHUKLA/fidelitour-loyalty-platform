<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FidéliTour</title>

    <!-- PWA: makes the wallet card installable to the home screen on iOS and
         Android. This is the only way to get push notifications working on
         iOS (Apple requires standalone PWA install before web push fires).
         Once installed, the card opens fullscreen and silently re-subscribes
         on launch so we keep working endpoints even if the browser rotated.

         IMPORTANT: the `<link rel="manifest">` href below is the DEFAULT
         (site-wide) manifest. The inline script that follows rewrites it
         to a per-card manifest BEFORE React boots whenever the user is
         on /card/FT-XXXXXXXX — so when they "Add to Home Screen", iOS /
         Android read the per-card manifest with the right start_url
         (otherwise the home-screen icon opens the landing page, not the
         actual card). MyWalletCardPage also re-applies the swap on
         client-side navigation, but doing it here too eliminates the
         race condition where iOS reads the manifest before React mounts. -->
    <link rel="manifest" href="/manifest.json" />
    <script>
      // ──────────────────────────────────────────────────────────────────
      // PWA bootstrap — runs SYNCHRONOUSLY in <head>, before any module
      // loads. Two responsibilities, both critical:
      //
      //   1. If we're on /card/FT-XXX:
      //       a. Rewrite the <link rel="manifest"> to the per-card
      //          manifest endpoint. (iOS Safari sometimes locks the href
      //          at parse time and ignores later changes — that's why
      //          this runs in <head>, not in a React useEffect.)
      //       b. Persist this barcode to localStorage as the device's
      //          "last visited card", so the launch failsafe below can
      //          deep-link future PWA launches that land on "/".
      //
      //   2. If we're a standalone PWA that launched at "/" and we
      //      have a stored last_card:
      //          history.replaceState to /card/<barcode> BEFORE React
      //          Router reads the initial location. The customer never
      //          sees the landing page, not even for one frame.
      //
      //   This is the failsafe that works EVEN IF the manifest swap
      //   above failed and iOS captured start_url=/ at install time.
      //   Both layers stacked — at least one always succeeds.
      // ──────────────────────────────────────────────────────────────────
      (function () {
        // Debug HUD — auto-shown whenever the page is launched as a
        // standalone PWA (iOS hides the address bar in that mode, so
        // ?debug=1 wouldn't be reachable). Also shown when the URL
        // includes ?debug=1 for testing in a normal Safari tab.
        //
        // Once the bug is fixed we'll switch HUD back to opt-in.
        var trace = { steps: [], standalone: false, hasLastCard: false };
        function note(s) { trace.steps.push(s); }
        function showHud() {
          // Show in two cases: opt-in via ?debug=1, OR running as a
          // standalone PWA (the case we cannot manually trigger).
          var optIn = location.search.indexOf('debug=1') !== -1;
          if (!optIn && !trace.standalone) return;
          var div = document.createElement('div');
          div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1F1B1A;color:#FFFFFF;font:12px/1.4 ui-monospace,Consolas,monospace;padding:14px 14px 12px;box-shadow:0 4px 16px rgba(0,0,0,0.5);max-height:70vh;overflow:auto;';
          var html = '<b style="color:#E8917C">PWA debug HUD</b>';
          if (trace.standalone) html += ' <span style="opacity:.55">(standalone mode auto-show)</span>';
          html += '<br><br>';
          for (var i = 0; i < trace.steps.length; i++) html += trace.steps[i] + '<br>';
          html += '<br><div style="display:flex;gap:6px;flex-wrap:wrap">';
          // Manual recovery: if we have a last_card stored, give the
          // user a one-tap button to jump to it. This works EVEN if the
          // automatic failsafe failed for whatever reason.
          if (trace.hasLastCard) {
            html += '<button onclick="window.location.href=\'/card/\'+localStorage.getItem(\'fidelitour:last_card\')" style="background:#4F7A36;color:white;border:none;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer;font-weight:600">Open my card →</button>';
          }
          html += '<button onclick="window.location.reload()" style="background:#4A90E2;color:white;border:none;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer">Reload</button>';
          html += '<button onclick="this.parentElement.parentElement.remove()" style="background:#57534E;color:white;border:none;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer">Close</button>';
          html += '</div>';
          div.innerHTML = html;
          if (document.body) document.body.appendChild(div);
          else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(div); });
        }

        try {
          var pathname = location.pathname || '/';
          note('pathname = ' + pathname);

          // Layer 1 — currently on a card page.
          var m = pathname.match(/^\/card\/([A-Za-z0-9_-]+)/);
          if (m) {
            var bc = m[1].toUpperCase();
            note('on /card/ page, barcode = ' + bc);
            var link = document.querySelector('link[rel="manifest"]');
            if (link) {
              link.setAttribute('href', '/api/manifest/' + bc);
              note('manifest link swapped to /api/manifest/' + bc);
            } else {
              note('NO &lt;link rel="manifest"&gt; tag found — manifest swap skipped');
            }
            try {
              localStorage.setItem('fidelitour:last_card', bc);
              note('wrote localStorage[fidelitour:last_card] = ' + bc);
            } catch (e) {
              note('localStorage.setItem failed: ' + (e.message || e));
            }
            showHud();
            return; // we're already on the right URL, nothing to redirect
          }

          // Layer 2 — root URL + standalone display mode → deep-link to
          // the device's last-known card. Catches the iOS bug where the
          // home-screen icon ignores manifest start_url and just opens "/".
          if (pathname !== '/' && pathname !== '') {
            note('not on root and not on /card/ — no action');
            showHud();
            return;
          }
          var mm = window.matchMedia && window.matchMedia('(display-mode: standalone)');
          var mmStandalone = mm ? mm.matches : false;
          var iosStandalone = window.navigator.standalone === true;
          var isStandalone = mmStandalone || iosStandalone;
          trace.standalone = isStandalone;
          note('matchMedia(standalone) = ' + mmStandalone + '; navigator.standalone = ' + iosStandalone);
          // Stash last_card existence early so the HUD can render an
          // "Open my card" button even on paths where the failsafe bails
          // (e.g. when not running standalone — they may still want the link).
          var stored = null;
          try { stored = localStorage.getItem('fidelitour:last_card'); } catch (e) {
            note('localStorage.getItem failed: ' + (e.message || e));
          }
          trace.hasLastCard = !!(stored && /^FT-?[A-Z0-9]+$/i.test(stored));
          if (!isStandalone) {
            note('NOT running as standalone PWA — failsafe skipped (this is fine in a regular browser tab)');
            showHud();
            return;
          }
          note('localStorage[fidelitour:last_card] = ' + JSON.stringify(stored));
          if (!stored || !/^FT-?[A-Z0-9]+$/i.test(stored)) {
            note('no valid last_card stored — cannot deep-link. Visit /card/&lt;FT-...&gt; in Safari once first.');
            showHud();
            return;
          }
          // DIAGNOSIS MODE — don't auto-redirect, just surface the
          // "Open my card" button in the HUD so the user can manually
          // confirm the deep-link works. Once we know the failsafe
          // path is healthy, this block flips back to:
          //     window.location.replace('/card/' + stored)
          note('READY to deep-link. Tap "Open my card →" in the HUD.');
          showHud();
        } catch (e) {
          note('FATAL: ' + (e.message || e));
          showHud();
        }
      })();
    </script>
    <meta name="theme-color" content="#B85C38" />
    <meta name="application-name" content="FidéliTour" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FidéliTour" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Single professional font — Inter — used everywhere across the
         platform (landing page, dashboard, all forms). Replaces the previous
         mix of Cormorant Garamond + Manrope; the global body rule in
         index.css overrides any leftover references. Loaded with
         display=swap so first paint isn't blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Leaflet — real interactive map tiles for the Customer Map page.
         Loaded via CDN so we don't need an npm dependency. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
