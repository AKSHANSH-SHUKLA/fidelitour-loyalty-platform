<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FidéliTour</title>

    <!-- PWA: makes the wallet card installable to the home screen on iOS and
         Android. This is the only way to get push notifications working on
         iOS (Apple requires standalone PWA install before web push fires).
         Once installed, the card opens fullscreen and silently re-subscribes
         on launch so we keep working endpoints even if the browser rotated.

         IMPORTANT: the `<link rel="manifest">` href below is the DEFAULT
         (site-wide) manifest. The inline script that follows rewrites it
         to a per-card manifest BEFORE React boots whenever the user is
         on /card/FT-XXXXXXXX — so when they "Add to Home Screen", iOS /
         Android read the per-card manifest with the right start_url
         (otherwise the home-screen icon opens the landing page, not the
         actual card). MyWalletCardPage also re-applies the swap on
         client-side navigation, but doing it here too eliminates the
         race condition where iOS reads the manifest before React mounts. -->
    <link rel="manifest" href="/manifest.json" />
    <script>
      // ──────────────────────────────────────────────────────────────────
      // PWA bootstrap — runs SYNCHRONOUSLY in <head>, before any module
      // loads. Two responsibilities, both critical:
      //
      //   1. If we're on /card/FT-XXX:
      //       a. Rewrite the <link rel="manifest"> to the per-card
      //          manifest endpoint. (iOS Safari sometimes locks the href
      //          at parse time and ignores later changes — that's why
      //          this runs in <head>, not in a React useEffect.)
      //       b. Persist this barcode to localStorage as the device's
      //          "last visited card", so the launch failsafe below can
      //          deep-link future PWA launches that land on "/".
      //
      //   2. If we're a standalone PWA that launched at "/" and we
      //      have a stored last_card:
      //          history.replaceState to /card/<barcode> BEFORE React
      //          Router reads the initial location. The customer never
      //          sees the landing page, not even for one frame.
      //
      //   This is the failsafe that works EVEN IF the manifest swap
      //   above failed and iOS captured start_url=/ at install time.
      //   Both layers stacked — at least one always succeeds.
      // ──────────────────────────────────────────────────────────────────
      (function () {
        try {
          var pathname = location.pathname || '/';

          // Layer 1 — currently on a card page.
          var m = pathname.match(/^\/card\/([A-Za-z0-9_-]+)/);
          if (m) {
            var bc = m[1].toUpperCase();
            var link = document.querySelector('link[rel="manifest"]');
            if (link) link.setAttribute('href', '/api/manifest/' + bc);
            try { localStorage.setItem('fidelitour:last_card', bc); } catch (_e) {}
            return; // we're already on the right URL, nothing to redirect
          }

          // Layer 2 — root URL + standalone display mode → deep-link to
          // the device's last-known card. Catches the iOS bug where the
          // home-screen icon ignores manifest start_url and just opens "/".
          if (pathname !== '/' && pathname !== '') return;
          var isStandalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true; // iOS Safari legacy flag
          if (!isStandalone) return;
          var stored = null;
          try { stored = localStorage.getItem('fidelitour:last_card'); } catch (_e) {}
          if (!stored || !/^FT-?[A-Z0-9]+$/i.test(stored)) return;
          // replaceState, not assign — no extra request, no flash, and
          // BrowserRouter reads the new pathname on its first render.
          window.history.replaceState({}, '', '/card/' + stored);
        } catch (_e) { /* never block first paint over a manifest swap */ }
      })();
    </script>
    <meta name="theme-color" content="#B85C38" />
    <meta name="application-name" content="FidéliTour" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FidéliTour" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Single professional font — Inter — used everywhere across the
         platform (landing page, dashboard, all forms). Replaces the previous
         mix of Cormorant Garamond + Manrope; the global body rule in
         index.css overrides any leftover references. Loaded with
         display=swap so first paint isn't blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Leaflet — real interactive map tiles for the Customer Map page.
         Loaded via CDN so we don't need an npm dependency. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
